replicaCount: 1

image:
  repository: ghcr.io/spaceworks-hq/spaceworks-events-backend
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Create this Secret outside Helm (External Secrets, Sealed Secrets, or kubectl).
# It must contain every production runtime variable in .env.example.
existingSecret: spaceworks-events-runtime

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: events.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

background:
  # Run email delivery (worker) and the timed jobs (beat) in their own
  # Deployments; the web pods then only serve requests. Turn off to run
  # everything in the web pods, as one-container installs do.
  enabled: true
  worker:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
  beat:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi

migration:
  # Runs the backend image's `migrate` role once per release.
  enabled: true
  image:
    repository: ghcr.io/spaceworks-hq/spaceworks-events-backend
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 300

nodeSelector: {}
tolerations: []
affinity: {}
