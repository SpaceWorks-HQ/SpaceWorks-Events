# The VPS deployment. Use scripts/vps-compose.sh, not docker-compose.yml.
# Layouts (SWE_LAYOUT in compose.env; vps-compose.sh turns on the profile):
#   split    website (frontend) and API (backend) containers on this VPS, two hostnames
#   single   one app container serves the website and the API, one hostname
#   netlify  the website runs on Netlify; this VPS serves the API
# Published releases set SWE_BACKEND_IMAGE / SWE_FRONTEND_IMAGE to
# ghcr.io/<owner>/spaceworks-events-backend|frontend; otherwise the images are
# built here under the local names below. Both carry placeholder public
# origins that the entrypoint replaces, so a hostname change needs no rebuild.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  image: ${SWE_BACKEND_IMAGE:-swevents-backend}:${SWE_VERSION:?Set a release version}
  env_file: ${SWE_CONFIG_DIR:?Set an external configuration directory}/app.env
  volumes:
    - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
  networks: [edge, data]
  logging: *logging
x-build: &build
  context: .
  args:
    NEXT_PUBLIC_BASE_URL: https://spaceworks-events-origin.invalid
    NEXT_PUBLIC_BACKEND_ORIGIN: https://spaceworks-events-backend.invalid
  # A throwaway build key (see secrets below); containers get theirs at runtime.
  secrets: [NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${SWE_CONFIG_DIR}/postgres.env
    entrypoint: ["/bin/sh", "/bootstrap/postgres-start.sh"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${SWE_CONFIG_DIR}/tls/postgres:/run/server-tls:ro
      - ./docker/vps/postgres-start.sh:/bootstrap/postgres-start.sh:ro
      - ./docker/vps/init-database.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./docker/vps/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "postgres", "-U", "swevents", "-d", "swevents"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/bootstrap/redis-start.sh"]
    volumes:
      - redis_data:/data
      - ${SWE_CONFIG_DIR}/tls/redis:/run/server-tls:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
      - ${SWE_CONFIG_DIR}/redis.conf:/run/redis.conf:ro
      - ./docker/vps/redis-start.sh:/bootstrap/redis-start.sh:ro
    healthcheck:
      # Prove TLS is available; application authentication is checked separately.
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -h redis ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  # Bundled Silo object storage (profile silo); external S3 skips both services.
  storage:
    profiles: [silo]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    env_file: ${SWE_CONFIG_DIR}/storage.env
    command: ["server", "/data", "--certs-dir", "/server-tls", "--console-address", ":9001"]
    volumes:
      - storage_data:/data
      - ${SWE_CONFIG_DIR}/tls/storage:/server-tls:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--cacert", "/tls/ca.crt", "https://storage:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  storage-init:
    profiles: [silo]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    env_file: ${SWE_CONFIG_DIR}/storage-init.env
    entrypoint: ["/bin/sh", "/bootstrap/init-storage.sh"]
    volumes:
      - ./docker/vps/init-storage.sh:/bootstrap/init-storage.sh:ro
      - ./docker/vps/storage-policy.json:/bootstrap/storage-policy.json:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      storage: { condition: service_healthy }
    networks: [data]
    logging: *logging

  # The backend image's migrate role: applies pending migrations once, then exits.
  migrator:
    image: ${SWE_BACKEND_IMAGE:-swevents-backend}:${SWE_VERSION}
    command: ["migrate"]
    restart: "no"
    env_file: ${SWE_CONFIG_DIR}/migrator.env
    volumes:
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    logging: *logging

  # The backend: the whole application in the single layout, the API otherwise.
  app:
    <<: *backend
    restart: unless-stopped
    build:
      <<: *build
      target: runner
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      migrator: { condition: service_completed_successfully }

  # The website in the split layout. It holds no database, Redis, storage or
  # mail credentials and reaches the backend through its HTTPS name, which the
  # proxy answers on the internal network.
  frontend:
    image: ${SWE_FRONTEND_IMAGE:-swevents-frontend}:${SWE_VERSION}
    profiles: [split]
    restart: unless-stopped
    build:
      <<: *build
      target: frontend
    env_file: ${SWE_CONFIG_DIR}/frontend.env
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]
    logging: *logging

  # Caddy HTTPS edge (profile caddy); an existing reverse proxy replaces it.
  proxy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      SITE_HOST: ${SITE_HOST:-}
      SWE_CADDY_OPTIONS: ${SWE_CADDY_OPTIONS:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./docker/vps/${SWE_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks:
      edge:
        aliases: ["${PUBLIC_HOST}"]
    logging: *logging

  scheduler:
    image: node:22-alpine
    restart: unless-stopped
    user: "1000:1000"
    env_file: ${SWE_CONFIG_DIR}/scheduler.env
    command: ["node", "/scheduler.mjs"]
    volumes:
      - ./docker/vps/scheduler.mjs:/scheduler.mjs:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]
    logging: *logging

  # The backend image's operator tools (setup, preflight, checks), run on demand.
  ops:
    <<: *backend
    profiles: [tools]
    user: "0:0"
    command: ["node", "scripts/check-production-env.mjs"]
    environment:
      SWE_LAYOUT: ${SWE_LAYOUT:-single}
    volumes:
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
      - ${SWE_CONFIG_DIR}/backups:/app/backups

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:

secrets:
  # A throwaway key that vps-compose.sh generates per run: builds never see an
  # installation's real key, which containers receive at runtime instead.
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
    environment: SWE_BUILD_KEY
