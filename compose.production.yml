# Full single-VPS deployment. Use scripts/vps-compose.sh, not docker-compose.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  image: swevents-app:${SWE_VERSION:?Set a release version}
  env_file: ${SWE_CONFIG_DIR:?Set an external configuration directory}/app.env
  volumes:
    - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
  networks: [edge, data]
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${SWE_CONFIG_DIR}/postgres.env
    entrypoint: ["/bin/sh", "/bootstrap/postgres-start.sh"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${SWE_CONFIG_DIR}/tls/postgres:/run/server-tls:ro
      - ./docker/vps/postgres-start.sh:/bootstrap/postgres-start.sh:ro
      - ./docker/vps/init-database.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./docker/vps/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "postgres", "-U", "swevents", "-d", "swevents"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/bootstrap/redis-start.sh"]
    volumes:
      - redis_data:/data
      - ${SWE_CONFIG_DIR}/tls/redis:/run/server-tls:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
      - ${SWE_CONFIG_DIR}/redis.conf:/run/redis.conf:ro
      - ./docker/vps/redis-start.sh:/bootstrap/redis-start.sh:ro
    healthcheck:
      # Prove TLS is available; application authentication is checked separately.
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -h redis ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    env_file: ${SWE_CONFIG_DIR}/storage.env
    command: ["server", "/data", "--certs-dir", "/server-tls", "--console-address", ":9001"]
    volumes:
      - storage_data:/data
      - ${SWE_CONFIG_DIR}/tls/storage:/server-tls:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--cacert", "/tls/ca.crt", "https://storage:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  storage-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    env_file: ${SWE_CONFIG_DIR}/storage-init.env
    entrypoint: ["/bin/sh", "/bootstrap/init-storage.sh"]
    volumes:
      - ./docker/vps/init-storage.sh:/bootstrap/init-storage.sh:ro
      - ./docker/vps/storage-policy.json:/bootstrap/storage-policy.json:ro
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      storage: { condition: service_healthy }
    networks: [data]
    logging: *logging

  migrator:
    image: swevents-migrator:${SWE_VERSION}
    build:
      context: .
      target: migrator
    restart: "no"
    env_file: ${SWE_CONFIG_DIR}/migrator.env
    volumes:
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    logging: *logging

  app:
    <<: *app
    restart: unless-stopped
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BASE_URL: https://${PUBLIC_HOST:?Set the public hostname}
      secrets: [NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      migrator: { condition: service_completed_successfully }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./docker/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]
    logging: *logging

  scheduler:
    image: node:22-alpine
    restart: unless-stopped
    user: "1000:1000"
    env_file: ${SWE_CONFIG_DIR}/scheduler.env
    command: ["node", "/scheduler.mjs"]
    volumes:
      - ./docker/vps/scheduler.mjs:/scheduler.mjs:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]
    logging: *logging

  ops:
    <<: *app
    image: swevents-ops:${SWE_VERSION}
    profiles: [tools]
    build:
      context: .
      target: ops
    volumes:
      - ${SWE_CONFIG_DIR}/tls/ca.crt:/tls/ca.crt:ro
      - ${SWE_CONFIG_DIR}/backups:/app/backups

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:

secrets:
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
    file: ${SWE_CONFIG_DIR}/actions-key
