name: Publish container images

on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # Never expose publishing credentials to a PR or fork workflow.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.NEXT_PUBLIC_BASE_URL != ''
    # Render builds from the repository itself; GHCR publishing is opt-in and
    # skipped (not failed) until NEXT_PUBLIC_BASE_URL is set as a repo variable.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/spaceworks-hq/spaceworks-events
      MIGRATOR_IMAGE: ghcr.io/spaceworks-hq/spaceworks-events-migrator
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate publishing settings
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          node <<'NODE'
          for (const key of ['NEXT_PUBLIC_BASE_URL', 'NEXT_SERVER_ACTIONS_ENCRYPTION_KEY']) {
            if (!process.env[key]?.trim()) throw new Error(`Missing GitHub Actions setting: ${key}`);
          }
          const url = new URL(process.env.NEXT_PUBLIC_BASE_URL);
          if (url.protocol !== 'https:' || url.origin !== process.env.NEXT_PUBLIC_BASE_URL) {
            throw new Error('NEXT_PUBLIC_BASE_URL must be an HTTPS origin without a trailing slash or path.');
          }
          const key = process.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY;
          const decoded = Buffer.from(key, 'base64');
          if (![16, 24, 32].includes(decoded.length) || decoded.toString('base64').replace(/=+$/, '') !== key.replace(/=+$/, '')) {
            throw new Error('NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be a valid base64 AES key.');
          }
          NODE

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migration image
        id: migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MIGRATOR_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push application image
        id: app
        uses: docker/build-push-action@v7
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
          secret-envs: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          # Secret changes do not invalidate Docker's build cache.
          no-cache-filters: builder

      - name: Record published images
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          {
            printf 'Published release `%s` (linux/amd64 and linux/arm64).\n\n' "$IMAGE_TAG"
            printf 'Application: `%s:%s`\n\n' "$APP_IMAGE" "$IMAGE_TAG"
            printf 'Migration: `%s:%s`\n\n' "$MIGRATOR_IMAGE" "$IMAGE_TAG"
            printf 'Pinned application: `%s@%s`\n\n' "$APP_IMAGE" "$APP_DIGEST"
            printf 'Pinned migration: `%s@%s`\n' "$MIGRATOR_IMAGE" "$MIGRATOR_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
