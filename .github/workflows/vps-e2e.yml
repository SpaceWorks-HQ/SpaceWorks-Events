# TEMPORARY: end-to-end test of off-site backups on a fresh GitHub runner
# against the test pre-release. Removed before merging.
name: VPS installer end-to-end
on:
  push:
    branches: [fix/offsite-backups]
    paths: [.github/workflows/vps-e2e.yml]

permissions:
  contents: read

env:
  RELEASE: v0.9.3-fix-offsite-backups.22.6ad24e65f2ca
  SILO: pgsty/silo:RELEASE.2026-09-16T00-00-00Z

jobs:
  offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install with nightly encrypted backups
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq expect >/dev/null
          cat > install.exp <<'EOF'
          set timeout 3600
          spawn bash -c "curl -fsSL [lindex $argv 0] | bash -s -- [lindex $argv 1]"
          expect "Repository" ; send "\r"
          expect "Hosting" ; send "2\r"
          expect "Public hostname" ; send "events.swe-test.example\r"
          expect "Super-admin email" ; send "admin@example.com\r"
          expect "HTTPS \\\[" ; send "1\r"
          expect "File storage \\\[" ; send "\r"
          expect "Sender" ; send "\r"
          expect "SMTP host" ; send "\r"
          expect "SMTP port" ; send "\r"
          expect "SMTP login" ; send "test-login\r"
          expect "SMTP password" ; send "test-password\r"
          expect {
            "automatic deploys" { send "n\r"; exp_continue }
            "Back up every night?" { send "\r"; exp_continue }
            "Encrypt backups" { send "\r"; exp_continue }
            "off-site S3 bucket" { send "n\r"; exp_continue }
            "Harden this server" { send "n\r"; exp_continue }
            "swap file" { send "n\r"; exp_continue }
            "Proceed?" { send "y\r"; exp_continue }
            -re {(AGE-SECRET-KEY-1[A-Z0-9]+)} { set f [open "key.txt" w]; puts $f $expect_out(1,string); close $f; exp_continue }
            "Type SAVED" { send "SAVED\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          expect install.exp "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE/install.sh" "--release $RELEASE" | tee install.log
          grep -q "${RELEASE#v} is running" install.log
          grep -q '^AGE-SECRET-KEY-1' key.txt

      - name: Start a private off-site S3 server (its own CA, reachable from containers)
        run: |
          set -e
          mkdir -p offsite && cd offsite
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=offsite-test-ca -keyout ca.key -out ca.crt 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=172.17.0.1 -keyout private.key -out request.csr 2>/dev/null
          printf 'subjectAltName=IP:172.17.0.1\nextendedKeyUsage=serverAuth\n' > extensions.cnf
          openssl x509 -req -in request.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile extensions.cnf -out public.crt 2>/dev/null
          chmod 644 private.key public.crt
          mkdir certs && cp private.key public.crt certs/
          docker run -d --name offsite-s3 -p 9443:9000 -e MINIO_ROOT_USER=offroot -e MINIO_ROOT_PASSWORD=offrootpass123 -v "$PWD/certs:/certs:ro" "$SILO" server /data --certs-dir /certs
          docker run --rm -v "$PWD/ca.crt:/ca.crt:ro" -e SSL_CERT_FILE=/ca.crt -e MC_HOST_off=https://offroot:offrootpass123@172.17.0.1:9443 --entrypoint sh "$SILO" -c \
            'until mc ls off >/dev/null 2>&1; do sleep 1; done; mc mb off/swe-offsite && mc admin user add off offkey offsecret12345+/ab && mc admin policy attach off readwrite --user offkey'

      - name: Turn on off-site copies from the installer menu (private CA, secret with / and +)
        run: |
          set -o pipefail
          cat > settings.exp <<'EOF'
          set timeout 600
          spawn sudo bash /opt/spaceworks-events/current/scripts/vps-backup-settings.sh
          expect "Choose 1-6" ; send "4\r"
          expect "Off-site S3 endpoint" ; send "https://172.17.0.1:9443\r"
          expect "CA certificate file" ; send "[lindex $argv 0]\r"
          expect "Off-site bucket" ; send "swe-offsite\r"
          expect "Folder in the bucket" ; send "\r"
          expect "Access key ID" ; send "offkey\r"
          expect "Secret access key" ; send "offsecret12345+/ab\r"
          expect "Days to keep" ; send "\r"
          expect "Off-site copies are on" {}
          expect "Choose 1-6" ; send "6\r"
          expect eof
          EOF
          expect settings.exp "$PWD/offsite/ca.crt" | tee settings.log
          grep -q 'Off-site copies are on' settings.log
          sudo grep -q "^OFFSITE_CA='offsite-ca.crt'" /etc/spaceworks-events/backup.env
          sudo test -f /etc/spaceworks-events/offsite-ca.crt

      - name: Back up, check the off-site copy, restore from it
        run: |
          set -o pipefail -x
          sudo bash /opt/spaceworks-events/current/scripts/vps-backup.sh | tee backup.log
          grep -q 'Copying the backup to the off-site bucket' backup.log
          name=$(sudo sh -c 'ls -d /etc/spaceworks-events/backups/2*Z | sort | tail -n 1 | xargs basename')
          sudo cat /etc/spaceworks-events/status/backup.json | tee status.json
          grep -q '"offsite":"ok"' status.json
          grep -q '"encrypted":true' status.json
          docker run --rm -v "$PWD/offsite/ca.crt:/ca.crt:ro" -e SSL_CERT_FILE=/ca.crt -e MC_HOST_off=https://offroot:offrootpass123@172.17.0.1:9443 --entrypoint mc "$SILO" \
            ls --recursive "off/swe-offsite/spaceworks-events/$name/" | tee listing.txt
          grep -q 'backup.tar.age' listing.txt
          ! grep -q 'database.dump' listing.txt
          # Remove the local copy, then restore from the off-site one.
          sudo rm -rf "/etc/spaceworks-events/backups/$name"
          sudo bash /opt/spaceworks-events/current/scripts/vps-restore.sh "offsite:$name" --identity "$PWD/key.txt" --yes | tee restore.log
          grep -q 'Restore finished' restore.log
          sudo test -f "/etc/spaceworks-events/backups/$name/backup.tar.age"

      - name: Turn off-site copies off again
        run: |
          set -o pipefail
          cat > off.exp <<'EOF'
          set timeout 600
          spawn sudo bash /opt/spaceworks-events/current/scripts/vps-backup-settings.sh
          expect "Choose 1-6" ; send "4\r"
          expect "Turn off off-site copies?" ; send "y\r"
          expect "Choose 1-6" ; send "6\r"
          expect eof
          EOF
          expect off.exp | tee off.log
          ! sudo grep -q '^OFFSITE_' /etc/spaceworks-events/backup.env
          ! sudo test -e /etc/spaceworks-events/offsite-ca.crt

      - name: Logs on failure
        if: failure()
        run: |
          export SWE_CONFIG_DIR=/etc/spaceworks-events
          sudo -E sh /opt/spaceworks-events/current/scripts/vps-compose.sh logs --tail 40 app || true
          docker logs --tail 30 offsite-s3 2>&1 || true
