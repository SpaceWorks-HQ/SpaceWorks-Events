# TEMPORARY: end-to-end test of the VPS installer on fresh GitHub runners
# against the test pre-release. Removed before merging.
name: VPS installer end-to-end
on:
  push:
    branches: [feat/backend-frontend-images]
    paths: [.github/workflows/vps-e2e.yml]

permissions:
  contents: read

env:
  RELEASE: v0.9.1-feat-backend-frontend-images.9.5009e46c4237
  OLD_RELEASE: v0.9.0-main.6.5d54f5595fa1

jobs:
  vps:
    strategy:
      fail-fast: false
      matrix:
        scenario: [split-fresh, upgrade-from-0.9.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare the host like a fresh VPS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq expect >/dev/null
          cat > split.exp <<'EOF'
          set timeout 3600
          set url [lindex $argv 0]
          set args [lindex $argv 1]
          spawn bash -c "curl -fsSL $url | SWE_CADDY_TLS=internal bash -s -- $args"
          expect "Hosting" ; send "\r"
          expect "Website hostname" ; send "events.swe-test.example\r"
          expect "API hostname" ; send "\r"
          expect "Super-admin email" ; send "admin@example.com\r"
          expect "Sender" ; send "\r"
          expect "SMTP host" ; send "\r"
          expect "SMTP port" ; send "\r"
          expect "SMTP login" ; send "test-login\r"
          expect "SMTP password" ; send "test-password\r"
          expect {
            "swap file" { send "n\r"; exp_continue }
            "Proceed?" { send "y\r" }
          }
          expect eof
          catch wait result
          exit [lindex $result 3]
          EOF
          cat > old.exp <<'EOF'
          set timeout 3600
          set url [lindex $argv 0]
          set args [lindex $argv 1]
          spawn bash -c "curl -fsSL $url | bash -s -- $args"
          expect "Hosting" ; send "1\r"
          expect "Public hostname" ; send "events.swe-test.example\r"
          expect "Super-admin email" ; send "admin@example.com\r"
          expect "Sender" ; send "\r"
          expect "SMTP host" ; send "\r"
          expect "SMTP port" ; send "\r"
          expect "SMTP login" ; send "test-login\r"
          expect "SMTP password" ; send "test-password\r"
          expect {
            "swap file" { send "n\r"; exp_continue }
            "Proceed?" { send "y\r" }
          }
          expect eof
          catch wait result
          exit [lindex $result 3]
          EOF
          cat > update.exp <<'EOF'
          set timeout 3600
          set url [lindex $argv 0]
          set args [lindex $argv 1]
          spawn bash -c "curl -fsSL $url | bash -s -- $args"
          expect "Choose 1-4" ; send "1\r"
          expect {
            "Proceed with the update?" { send "y\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF

      - name: Install the split layout from the pre-release
        if: matrix.scenario == 'split-fresh'
        run: |
          set -o pipefail
          expect split.exp "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE/install.sh" "--release $RELEASE" | tee install.log
          grep -q 'Downloading the release images from GitHub Packages' install.log
          grep -q "${RELEASE#v} is running" install.log

      - name: Install 0.9.0, then update to the pre-release
        if: matrix.scenario == 'upgrade-from-0.9.0'
        run: |
          set -o pipefail
          expect old.exp "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" "--release $OLD_RELEASE" | tee install.log
          grep -q "${OLD_RELEASE#v} is running" install.log
          expect update.exp "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE/install.sh" "--release $RELEASE" | tee update.log
          grep -q "Updated to ${RELEASE#v}" update.log

      - name: Check the running installation
        run: |
          set -x
          export SWE_CONFIG_DIR=/etc/spaceworks-events
          c() { sudo -E sh /opt/spaceworks-events/current/scripts/vps-compose.sh "$@"; }
          sudo grep -E '^(SWE_|PUBLIC_|SITE_)' "$SWE_CONFIG_DIR/compose.env"
          ! sudo grep -qE '^SWE_(APP|MIGRATOR|OPS)_IMAGE=' "$SWE_CONFIG_DIR/compose.env"
          c ps --format '{{.Service}} {{.Image}} {{.Status}}'
          c ps --format '{{.Image}}' | grep -q "ghcr.io/spaceworks-hq/spaceworks-events-backend:${RELEASE#v}"
          c run --rm --no-deps ops node docker/vps/check.mjs
          c run --rm --no-deps ops node docker/vps/smoke.mjs
          ! c exec -T app grep -rlF spaceworks-events-origin.invalid /app/.next
          if [ "${{ matrix.scenario }}" = split-fresh ]; then
            c ps --format '{{.Image}}' | grep -q "ghcr.io/spaceworks-hq/spaceworks-events-frontend:${RELEASE#v}"
            ! c exec -T frontend grep -rlF -e spaceworks-events-origin.invalid -e spaceworks-events-backend.invalid /app/frontend/.next
            # Through Caddy: the website, and the website reaching the API.
            curl -sk --resolve events.swe-test.example:443:127.0.0.1 -o /dev/null -w '%{http_code}\n' https://events.swe-test.example/login | grep -q '^200$'
            curl -sk --resolve api.events.swe-test.example:443:127.0.0.1 -o /dev/null -w '%{http_code}\n' https://api.events.swe-test.example/api/health | grep -q '^200$'
            curl -sk --resolve events.swe-test.example:443:127.0.0.1 https://events.swe-test.example/login | grep -q 'https://events.swe-test.example'
          else
            sudo grep -q "^SWE_LAYOUT=" "$SWE_CONFIG_DIR/compose.env" && exit 1 || true
            ! c ps --format '{{.Service}}' | grep -qx frontend
            curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: events.swe-test.example' http://127.0.0.1/login | grep -q '^308 https://events.swe-test.example/login'
          fi

      - name: Back up and restore
        run: |
          sudo bash /opt/spaceworks-events/current/scripts/vps-backup.sh
          backup=$(sudo sh -c 'ls -d /etc/spaceworks-events/backups/2*Z | sort | tail -n 1')
          sudo bash /opt/spaceworks-events/current/scripts/vps-restore.sh "$backup" --yes

      - name: Logs on failure
        if: failure()
        run: |
          export SWE_CONFIG_DIR=/etc/spaceworks-events
          sudo -E sh /opt/spaceworks-events/current/scripts/vps-compose.sh logs --tail 60 app frontend migrator proxy || true
